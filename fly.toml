# fly.toml app configuration file for AXIS
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

app = "axis-irrigation"
primary_region = "jnb"

[build]
  dockerfile = "Containerfile"

[env]
  PORT = "8080"
  AXIS_WEATHER_MODE = "live"
  KIJANISPACE_API_URL = "https://api.kijanispace.eu/v1/agro_climate/land"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/api/v1/health"
  timeout = "5s"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
